# ============================================================
# PROJECT SETUP: replace every value marked REPLACE
# ============================================================
bundle:
  name: my_project                      # REPLACE: e.g. avaada_edp

include:
  - resources/*.yml

variables:
  catalogs:
    type: complex
    description: >
      Catalog per layer. Catalogs must already exist (created by Terraform/admin).
      One-catalog project: use the same catalog name for every layer.
      More catalogs: add keys and use them as ${var.catalogs.<key>}.

targets:
  # ---------- DEV: auto-deployed on merge ----------
  dev:
    mode: development
    default: true
    workspace:
      host: https://8259552087648510.0.gcp.databricks.com   # REPLACE
    variables:
      catalogs:
        bronze: we_databricks_poc              # REPLACE
        silver: we_databricks_poc              # REPLACE
        gold: we_databricks_poc                  # REPLACE

  # ---------- UAT: deployed after approval ----------
  uat:
    mode: production
    workspace:
      host: https://8259552087648510.0.gcp.databricks.com
    run_as:
      service_principal_name: fc5e275e-cdc6-429a-8cc0-26077d3bb94f
    variables:
      catalogs:
        bronze: poc_dbx_mkt
        silver: poc_dbx_mkt
        gold: poc_dbx_mkt
    resources:
      schemas:
        bronze:
          lifecycle:
            prevent_destroy: true
        silver:
          lifecycle:
            prevent_destroy: true
        gold:
          lifecycle:
            prevent_destroy: true

  # ---------- PROD: deployed after approval ----------
  prod:
    mode: production
    workspace:
      host: https://8259552087648510.0.gcp.databricks.com
    run_as:
      service_principal_name: fc5e275e-cdc6-429a-8cc0-26077d3bb94f
    variables:
      catalogs:
        bronze: poc_dbx_mkt
        silver: poc_dbx_mkt
        gold: poc_dbx_mkt
    resources:
      schemas:
        bronze:
          lifecycle:
            prevent_destroy: true
        silver:
          lifecycle:
            prevent_destroy: true
        gold:
          lifecycle:
            prevent_destroy: true