# ============================================================
# PROJECT SETUP: replace every value marked REPLACE
# ============================================================
bundle:
  name: my_project                      # REPLACE: e.g. avaada_edp

include:
  - resources/*.yml

variables:
  catalogs:
    type: complex
    description: >
      Catalog per layer. Catalogs must already exist (created by Terraform/admin).
      One-catalog project: use the same catalog name for every layer.
      More catalogs: add keys and use them as ${var.catalogs.<key>}.
      Each target must use its own catalogs; never reuse catalog names across targets.

  alerts:
    type: complex
    description: >
      Failure-alert email per team (use group mailboxes).
      Add a key per team and use it in jobs as ${var.alerts.<key>}.
      Every key used by a job must exist in every target.

targets:
  # ---------- DEV: auto-deployed on merge ----------
  dev:
    mode: development
    default: true
    workspace:
      host: https://8259552087648510.0.gcp.databricks.com   # REPLACE
    variables:
      catalogs:
        bronze: we_databricks_poc              # REPLACE
        silver: we_databricks_poc              # REPLACE
        gold: we_databricks_poc                  # REPLACE
      alerts:
        platform: pritam.chaurasiya@ganitinc.com     # REPLACE
        sap_team: pritam.chaurasiya@ganitinc.com     # REPLACE
        # hr_team: your-email@example.com      # REPLACE
        # fin_team: your-email@example.com     # REPLACE

