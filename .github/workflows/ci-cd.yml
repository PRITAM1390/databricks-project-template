name: CI/CD

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [dev, uat, main]
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABRICKS_AUTH_TYPE: oauth-m2m

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.map.outputs.target }}
    steps:
      - id: map
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          case "$BRANCH" in
            dev)  echo "target=dev"  >> "$GITHUB_OUTPUT" ;;
            uat)  echo "target=uat"  >> "$GITHUB_OUTPUT" ;;
            main) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown branch: $BRANCH"; exit 1 ;;
          esac

  checks:
    name: Validate bundle
    needs: resolve
    runs-on: ubuntu-latest
    environment: ci
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . --output-format=github
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate -t ${{ needs.resolve.outputs.target }}

  deploy:
    name: Deploy
    needs: [resolve, checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.target }}
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Deploy bundle
        run: databricks bundle deploy -t ${{ needs.resolve.outputs.target }}
      - name: Run changed DDL
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files 'src/ddl/*.sql' 'src/ddl/**/*.sql')
          else
            FILES=$(git diff --name-only --no-renames --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- src/ddl | grep '\.sql$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "No DDL changes in this merge."
          else
            echo "DDL files to run:"; echo "$FILES"
            python scripts/run_ddl.py -t ${{ needs.resolve.outputs.target }} $FILES
          fi
